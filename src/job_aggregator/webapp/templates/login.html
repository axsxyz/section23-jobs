<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Connexion — Section23</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">23</div>
    <h1 class="login-title">Bienvenue</h1>
    <p class="login-subtitle">Connectez-vous pour accéder au tableau de bord</p>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="login-form">
      <div class="login-field">
        <label for="username" class="login-label">Identifiant</label>
        <input type="text" id="username" name="username" class="login-input"
               placeholder="Votre identifiant" required autofocus autocomplete="username">
      </div>
      <div class="login-field">
        <label for="password" class="login-label">Mot de passe</label>
        <input type="password" id="password" name="password" class="login-input"
               placeholder="Mot de passe" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn">Se connecter</button>
    </form>
    <p class="login-footer">Section23 Jobs</p>
  </div>
</body>
</html>
